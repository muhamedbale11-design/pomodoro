[package]
name = "pomodoro-app"
version = "0.1.0"
description = "A focus timer desktop app built with Tauri"
authors = ["mohamedalaa"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pomodoro_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }

# The menu bar tray only exists on desktop platforms. Keeping the feature
# target-scoped means the same source tree also compiles for mobile.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
